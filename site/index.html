<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>山路管制 — 去程路線管制查詢</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f0f10'/><path d='M6 23l7-12 4 6 3-4 6 10z' fill='%235ce0b8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="20" height="20"><path d="M5 24l8-13 4.5 7L21 13l6 11z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      </div>
      <h1>山路管制</h1>
      <button id="btn-info" class="icon-btn" type="button" title="資料更新時間與免責聲明" aria-label="資料更新時間與免責聲明">ⓘ</button>
    </header>

    <div id="error-bar" class="error-bar" hidden></div>

    <section class="route-form">
      <div class="field-row">
        <div class="fields">
          <label class="field">
            <span class="dot dot-origin" aria-hidden="true"></span>
            <input id="input-origin" type="text" placeholder="起點" autocomplete="off" spellcheck="false">
          </label>
          <label class="field">
            <span class="dot dot-dest" aria-hidden="true"></span>
            <input id="input-dest" type="text" placeholder="終點" autocomplete="off" spellcheck="false">
          </label>
        </div>
        <button id="btn-swap" class="icon-btn swap" type="button" title="交換起終點" aria-label="交換起終點">⇅</button>
      </div>
      <button id="btn-plan" class="primary-btn" type="button">規劃路線</button>
      <div class="pick-row">
        <button id="btn-pick-origin" class="ghost-btn" type="button">點地圖設起點</button>
        <button id="btn-pick-dest" class="ghost-btn" type="button">點地圖設終點</button>
      </div>
      <div class="time-row">
        <div class="chip-set seg" id="chip-timemode" role="group" aria-label="時間模式">
          <button class="chip is-on" type="button" data-mode="depart">出發</button>
          <button class="chip" type="button" data-mode="arrive">抵達</button>
        </div>
        <input id="input-time" class="time-input" type="datetime-local" aria-label="出發或抵達時間">
      </div>
      <p id="route-status" class="route-status">尚未規劃路線</p>
    </section>

    <section class="filters">
      <div class="filter-group">
        <span class="filter-label">顯示</span>
        <button id="chip-active" class="chip" type="button" data-on="false">只看進行中</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">路線</span>
        <div class="chip-set" id="chip-roads">
          <button class="chip is-on" type="button" data-road="all">全部</button>
          <button class="chip" type="button" data-road="台18線">台18</button>
          <button class="chip" type="button" data-road="台21線">台21</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">路線偏好</span>
        <div class="chip-set" id="chip-prefer">
          <button class="chip is-on" type="button" data-prefer="auto">自動</button>
          <button class="chip" type="button" data-prefer="tw21">台21</button>
        </div>
      </div>
    </section>

    <div id="list" class="list"><p class="empty">載入中…</p></div>

    <footer class="sidebar-foot">資料僅供參考，出發前請以官方公告為準。</footer>
  </aside>

  <main id="map"></main>
</div>

<div id="info-modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="info-title">
    <h2 id="info-title">關於這個站</h2>
    <p class="modal-row">資料更新時間：<strong id="info-updated">—</strong></p>
    <p class="modal-note">本站彙整省道管制公告並與您的路線比對，<strong>僅供行前參考</strong>。里程轉座標為公里級精度，標記位置可能有數百公尺誤差。出發前請務必查看公路局等官方公告。</p>
    <p class="modal-note muted">底圖 &copy; OpenStreetMap contributors · 路線 OSRM · 地理編碼 Nominatim</p>
    <button id="btn-info-close" class="primary-btn" type="button">知道了</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
